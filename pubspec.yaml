name: nabe_bank_application
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.2
  image_picker: ^1.1.2
  image: ^4.5.4
  dio: ^5.9.0
  nfc_manager: ^4.0.2
  flutter_svg: ^2.2.2
  intl: ^0.20.2
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/
    - lib/assets/fonts/
    - lib/assets/svg/
    - lib/assets/svg/navigation/
  fonts:
    - family: Inter
      fonts:
        - asset: lib/assets/fonts/Inter-VariableFont_opsz,wght.ttf
